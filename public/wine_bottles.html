<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>WineMine · Wine Bottles</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin:0; padding:0; height:100%; font-family: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wine-bottles.jsx"></script>
<script type="text/babel" data-presets="env,react">
function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="hero"
        title="00 · The Four Vines"
        subtitle="레드 · 화이트 · 로제 · 스파클링 — 네 종류의 와인을 한 자리에서 비교."
      >
        <DCArtboard id="hero-all" label="Four Bottles · Lineup" width={780} height={580}>
          <BottleHero/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="red"
        title="01 · Red Wine"
        subtitle="보르도 (어깨 각짐) / 부르고뉴 (어깨 둥금) / 라인 미니멀. 다크 그린 글래스 + 와인 컬러 라벨."
      >
        <DCArtboard id="r-bordeaux" label="A · Bordeaux Detailed" width={240} height={520}>
          <BottleRedBordeaux/>
        </DCArtboard>
        <DCArtboard id="r-burgundy" label="B · Burgundy Flat" width={240} height={520}>
          <BottleRedBurgundy/>
        </DCArtboard>
        <DCArtboard id="r-line" label="C · Line Minimal" width={240} height={520}>
          <BottleRedLine/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="white"
        title="02 · White Wine"
        subtitle="알자스 (가늘고 김) / 부르고뉴 (둥근 어깨, 샤르도네) / 라인. 페일 그린 글래스 + 옅은 골드/크림 라벨."
      >
        <DCArtboard id="w-alsace" label="A · Alsace Detailed" width={240} height={520}>
          <BottleWhiteAlsace/>
        </DCArtboard>
        <DCArtboard id="w-burgundy" label="B · Burgundy Flat" width={240} height={520}>
          <BottleWhiteBurgundy/>
        </DCArtboard>
        <DCArtboard id="w-line" label="C · Line Minimal" width={240} height={520}>
          <BottleWhiteLine/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="rose"
        title="03 · Rosé"
        subtitle="프로방스 (살구빛) / 타벨 (진한 코랄) / 라인. 투명 핑크 글래스 + 옅은 크림 라벨."
      >
        <DCArtboard id="ro-provence" label="A · Provence Detailed" width={240} height={520}>
          <BottleRoseProvence/>
        </DCArtboard>
        <DCArtboard id="ro-tavel" label="B · Tavel Flat" width={240} height={520}>
          <BottleRoseFlat/>
        </DCArtboard>
        <DCArtboard id="ro-line" label="C · Line Minimal" width={240} height={520}>
          <BottleRoseLine/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="sparkling"
        title="04 · Sparkling"
        subtitle="샴페인 (두꺼운 보디, 골드 포일) / 프로세코 (페일 그린, 가벼움) / 라인. 골드 디테일 강조."
      >
        <DCArtboard id="sp-champagne" label="A · Champagne Detailed" width={240} height={520}>
          <BottleSparklingChampagne/>
        </DCArtboard>
        <DCArtboard id="sp-prosecco" label="B · Prosecco Flat" width={240} height={520}>
          <BottleSparklingProsecco/>
        </DCArtboard>
        <DCArtboard id="sp-line" label="C · Line Minimal" width={240} height={520}>
          <BottleSparklingLine/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
